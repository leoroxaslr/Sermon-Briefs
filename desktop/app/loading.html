<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>Sermon Brief</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #4b46d6;
        color: #fff;
        font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }
      main {
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0;
        opacity: 0.8;
      }
      .bar {
        width: 160px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.25);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #fff;
        border-radius: 2px;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="" />
      <h1>Sermon Brief</h1>
      <div class="bar" role="progressbar" aria-label="Starting"></div>
      <p>Starting…</p>
    </main>
  </body>
</html>
